<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;background:transparent;}
.scene{position:relative;width:100%;max-width:1100px;margin:auto;aspect-ratio:16/9;overflow:hidden;border-radius:18px;background:#078fc7;}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:float 5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.012) translateY(-4px)}}
.wave{position:absolute;left:-12%;bottom:-16%;width:124%;height:30%;border-radius:50% 50% 0 0;background:rgba(70,225,255,.20);animation:wave 5s ease-in-out infinite alternate;}
.wave2{bottom:-20%;background:rgba(255,255,255,.10);animation-duration:7s;}
@keyframes wave{from{transform:translateX(-28px) rotate(-.5deg)}to{transform:translateX(28px) rotate(.5deg)}}
.shine{position:absolute;top:-30%;left:-30%;width:9%;height:160%;background:rgba(255,255,255,.22);filter:blur(8px);transform:rotate(18deg);animation:shine 6s linear infinite;}
@keyframes shine{from{left:-30%}to{left:130%}}
.bubble{position:absolute;bottom:-45px;border:2px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(255,255,255,.08);box-shadow:inset 3px 3px 6px rgba(255,255,255,.45),0 0 8px rgba(255,255,255,.25);animation:up linear infinite;}
.b1{width:24px;height:24px;left:8%;animation-duration:7s}.b2{width:14px;height:14px;left:22%;animation-duration:5.5s;animation-delay:1s}
.b3{width:34px;height:34px;left:40%;animation-duration:9s;animation-delay:2s}.b4{width:18px;height:18px;left:58%;animation-duration:6s;animation-delay:.5s}
.b5{width:29px;height:29px;left:73%;animation-duration:8s;animation-delay:2.5s}.b6{width:12px;height:12px;left:87%;animation-duration:5s;animation-delay:1.5s}
@keyframes up{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(22px,-300px)}100%{transform:translate(-18px,-700px);opacity:0}}
.spark{position:absolute;color:#fff;font-size:20px;text-shadow:0 0 10px #fff;animation:twinkle 2s ease-in-out infinite;}
.s1{left:14%;top:25%}.s2{left:76%;top:22%;animation-delay:.5s}.s3{left:53%;top:70%;animation-delay:1s}.s4{left:31%;top:56%;animation-delay:1.5s}.s5{left:89%;top:65%;animation-delay:.8s}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
</style>
</head>
